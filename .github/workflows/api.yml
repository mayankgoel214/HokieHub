name: API

on:
  push:
    paths: ['api/**', '.github/workflows/api.yml']
  pull_request:
    paths: ['api/**', '.github/workflows/api.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # `verify` runs the unit tests and then the Testcontainers integration
      # tests, which start a real PostgreSQL. GitHub's Ubuntu runners ship with
      # Docker, so no extra service container is needed.
      - name: Build and test
        working-directory: api
        run: mvn -B verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            api/target/surefire-reports/
            api/target/failsafe-reports/

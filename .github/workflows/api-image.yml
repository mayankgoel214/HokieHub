# Railway's own builder refuses to build this service — every attempt fails
# before it emits a line of build output — so the image is built here instead
# and Railway is pointed at the published tag.
name: API image

on:
  push:
    branches: [main]
    paths: ['api/**', '.github/workflows/api-image.yml']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The runner's own GITHUB_TOKEN can push to the container registry, so
      # this needs no personal access token.
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          # linux/amd64 only: the deployment target is x86, and building the
          # arm64 variant as well would double the build for nothing.
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/hokiehub-api:latest
            ghcr.io/${{ github.repository_owner }}/hokiehub-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

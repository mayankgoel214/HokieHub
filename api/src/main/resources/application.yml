spring:
  application:
    name: hokiehub-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hokiehub}
    username: ${DATABASE_USER:hokiehub}
    password: ${DATABASE_PASSWORD:hokiehub}

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate validates that the mapping matches it and
      # refuses to start otherwise, which catches drift at boot instead of at runtime.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: ${CACHE_TYPE:redis}

hokiehub:
  jwt:
    # The Supabase project's JWT secret. Overridden in every real environment;
    # the fallback exists only so a local run starts without configuration.
    secret: ${SUPABASE_JWT_SECRET:local-development-secret-not-for-any-real-deployment}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${PORT:8080}

logging:
  level:
    edu.vt.hokiehub: INFO

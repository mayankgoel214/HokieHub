spring:
  application:
    name: hokiehub-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hokiehub}
    username: ${DATABASE_USER:hokiehub}
    password: ${DATABASE_PASSWORD:hokiehub}

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate validates that the mapping matches it and
      # refuses to start otherwise, which catches drift at boot instead of at runtime.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Empty by default: the Compose Redis is on a private network with no
      # password, but a managed one requires auth, and without this the client
      # fails every command with NOAUTH after the connection appears to succeed.
      password: ${REDIS_PASSWORD:}

  cache:
    type: ${CACHE_TYPE:redis}

hokiehub:
  supabase:
    # The project's base URL. Its JWKS endpoint publishes the public half of the
    # ES256 key Supabase signs sessions with, so no secret is stored here at all.
    # No default: a forgotten setting has to be a startup failure, not a service
    # that boots and trusts anything. docker-compose.yml supplies one locally.
    url: ${SUPABASE_URL:}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${PORT:8080}

logging:
  level:
    edu.vt.hokiehub: INFO
